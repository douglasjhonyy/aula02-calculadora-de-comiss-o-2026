<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora de Comissão</title>
</head>
<body>
    <main>
        <form class="container">
            <h1 class="titulo">Calculadora de Comissão</h1>
            <input class="caixa-texto" type="text" placeholder="Digite seu nome">
            <input class="caixa-texto" type="number" placeholder="Digete o valor de vendas">
            <button class="btn-calc" type="button">Calcular Salário</button>
            <div class="resultado">Resultado aparecerá aqui </div>
        </form>
    </main>
</body>
</html>
